<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山支大师的御膳房</title>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<style>
/* ===================== 【库洛米主题切换区，自行修改颜色即可】 ===================== */
:root{
    --main:#ff8696;
    --light:#fff3f5;
    --light2:#ffe4e8;
    --gray:#777777;
    --card-radius:18px;
    --font-family:"Microsoft Yahei",system-ui,-apple-system,sans-serif;
    /* 库洛米配色示例（取消下面注释即可套用，按需调整）
    --main:#6b5b95;
    --light:#f3f0fa;
    --light2:#e2d9f2;
    */
}
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:var(--font-family);
}
body{
    background:var(--light);
    color:#333;
    min-height:100vh;
    padding-bottom:40px;
}
.container{
    max-width:960px;
    margin:0 auto;
    padding:22px 16px;
}
.card{
    background:#ffffff;
    border-radius:var(--card-radius);
    padding:26px;
    margin:20px 0;
    box-shadow:0 4px 14px rgba(255,134,150,0.12);
}
.btn{
    padding:11px 20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:15px;
    margin:5px;
    transition:0.2s ease;
}
.btn:hover{
    transform:translateY(-1px);
}
.btn-primary{
    background:var(--main);
    color:#fff;
}
.btn-gray{
    background:#eeeeee;
    color:#333;
}
input,textarea{
    width:100%;
    padding:12px;
    border:1px solid #f0d8dd;
    border-radius:12px;
    margin:9px 0;
    font-size:15px;
    background:#fff;
}
.hidden{display:none !important;}
.nav{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
}
.dish-item{
    padding:14px 10px;
    border-bottom:1px solid #f6e4e8;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}
.dish-img-small{
    width:64px;
    height:64px;
    object-fit:cover;
    border-radius:10px;
    background:#f8e8ec;
}
.banner-deco{
    width:100%;
    height:160px;
    border-radius:var(--card-radius);
    background-image:url("");
    background-size:cover;
    background-position:center;
    margin-bottom:20px;
}
#qrcanvas{
    margin:16px auto;
    display:block;
    background:white;
    padding:12px;
    border-radius:14px;
}
.tip-text{
    font-size:13px;
    color:var(--gray);
    margin:8px 0;
}
/* 批量录入表格样式 */
.batch-table{
    width:100%;
    border-collapse: collapse;
    margin:12px 0;
}
.batch-table td{
    padding:8px 4px;
    vertical-align:middle;
}
.batch-table input{
    margin:0;
}
.table-img-preview{
    width:50px;
    height:50px;
    object-fit:cover;
    border-radius:8px;
}
</style>
</head>
<body>
<div class="container">

<div class="banner-deco"></div>

<div id="loginPage" class="card">
<h2 style="text-align:center;">管理员登录</h2>
<p class="tip-text" style="text-align:center;">仅管理端需要登录，扫码点菜访客无需账号</p>
<input placeholder="管理员账号" id="usr">
<input placeholder="管理员密码" id="pwd" type="password">
<button class="btn btn-primary" style="width:100%;" onclick="login()">进入后台管理</button>
<p style="margin-top:12px;color:var(--gray);text-align:center;">默认账号：admin｜密码：menu2026</p>
<br>
<div style="text-align:center;">
<a href="#/order">👉访客点菜入口（直接分享给对象）</a>
</div>
</div>

<div id="adminPage" class="hidden">
<div class="nav">
<button class="btn btn-primary" onclick="showAddDish()">单条新增菜品</button>
<button class="btn btn-primary" onclick="showBatchAdd()">表格快速批量录入</button>
<button class="btn btn-gray" onclick="genShare()">生成点菜链接&二维码</button>
<button class="btn btn-gray" onclick="logout()">退出登录</button>
</div>

<div class="card">
<h3>我的菜品库</h3>
<div id="dishList"></div>
</div>

<!-- 单条新增：图片上传控件（手机可直接选择相册图片） -->
<div class="card hidden" id="addForm">
<h3>单条添加菜品</h3>
<input placeholder="菜品名称" id="dname">
<input placeholder="菜品价格" id="dprice">
<div>
<label>上传菜品图片（手机相册直接选择）</label>
<input type="file" accept="image/*" id="dimgUpload">
<img id="singleImgPreview" class="dish-img-small" style="margin-top:8px;display:none;">
</div>
<textarea placeholder="菜品简短备注" id="dnote"></textarea>
<button class="btn btn-primary" onclick="saveDish()">保存菜品</button>
<button class="btn btn-gray" onclick="closeAdd()">取消</button>
</div>

<!-- 表格批量录入模式 -->
<div class="card hidden" id="batchForm">
<h3>表格快速批量录入菜品</h3>
<p class="tip-text">点击增加一行，每一行填写菜品名称、价格、上传图片、备注，完成后批量保存</p>
<table class="batch-table" id="batchTable">
<tbody>
</tbody>
</table>
<button class="btn btn-primary" onclick="addTableRow()">➕新增一行</button>
<br>
<button class="btn btn-primary" onclick="batchSave()">批量保存全部菜品</button>
<button class="btn btn-gray" onclick="closeBatchAdd()">取消</button>
</div>

<div class="card">
<h3>点菜分享二维码</h3>
<canvas id="qrcanvas"></canvas>
<p>点菜链接：<span id="shareLink"></span></p>
<button class="btn btn-primary" onclick="copyLink()">复制分享链接</button>
<p class="tip-text">把链接/二维码发给对方即可直接点菜，无需登录</p>
</div>
</div>

<div id="orderPage" class="hidden">
<div class="card">
<h2 style="text-align:center;">在线点菜 🥰</h2>
<div id="visitDishList"></div>
</div>
<div class="card">
<h3>已选菜品</h3>
<div id="cartBox"></div>
<button class="btn btn-primary" style="width:100%;margin-top:10px;" onclick="submitOrder()">确认下单，发送订单邮件</button>
</div>
</div>

</div>

<script>
// ============ EmailJS配置（部署后替换） ============
const EMAIL_SERVICE_ID = "YOUR_SERVICE_ID";
const EMAIL_TEMPLATE_ID = "YOUR_TEMPLATE_ID";
const EMAIL_PUBLIC_KEY = "YOUR_PUBLIC_KEY";
emailjs.init(EMAIL_PUBLIC_KEY);

const defaultUser = {username:"admin",password:"menu2026"};

let currentUser = JSON.parse(localStorage.getItem("menuAdmin"))||null;
let dishData = JSON.parse(localStorage.getItem("dishStore"))||[];
let cart = [];
let singleDishBase64 = "";

// 路由分发
function route(){
  let hash = location.hash;
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("adminPage").classList.add("hidden");
  document.getElementById("orderPage").classList.add("hidden");
  if(hash === "#/order"){
    document.getElementById("orderPage").classList.remove("hidden");
    renderVisitDish();
  }else{
    if(currentUser){
      document.getElementById("adminPage").classList.remove("hidden");
      renderDish();
    }else{
      document.getElementById("loginPage").classList.remove("hidden");
    }
  }
}

// 登录登出
function login(){
  let u = document.getElementById("usr").value.trim();
  let p = document.getElementById("pwd").value.trim();
  if(u===defaultUser.username && p===defaultUser.password){
    localStorage.setItem("menuAdmin",JSON.stringify(defaultUser));
    currentUser = defaultUser;
    route();
  }else{
    alert("账号或者密码不正确");
  }
}
function logout(){
  localStorage.removeItem("menuAdmin");
  currentUser = null;
  location.hash = "";
  route();
}

// 单条上传图片转Base64
document.getElementById("dimgUpload").addEventListener("change",function(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = function(ev){
        singleDishBase64 = ev.target.result;
        document.getElementById("singleImgPreview").src = singleDishBase64;
        document.getElementById("singleImgPreview").style.display = "block";
    }
    reader.readAsDataURL(file);
})

// 后台菜品渲染
function renderDish(){
  let html = "";
  dishData.forEach((item,idx)=>{
    let imgHtml = item.img ? `<img class="dish-img-small" src="${item.img}">` : `<div class="dish-img-small"></div>`;
    html += `<div class="dish-item">
    ${imgHtml}
    <div>${item.name}｜¥${item.price}｜${item.note||"无备注"}</div>
    <button class="btn btn-gray" onclick="delDish(${idx})">删除</button>
    </div>`
  })
  document.getElementById("dishList").innerHTML = html||"<p>暂无菜品，请添加菜品</p>";
}

// 单条菜品表单
function showAddDish(){
    document.getElementById("addForm").classList.remove("hidden");
    singleDishBase64 = "";
    document.getElementById("singleImgPreview").style.display = "none";
    document.getElementById("dimgUpload").value = "";
}
function closeAdd(){document.getElementById("addForm").classList.add("hidden")}
function saveDish(){
  let name = document.getElementById("dname").value.trim();
  let price = document.getElementById("dprice").value.trim();
  let note = document.getElementById("dnote").value.trim();
  if(!name){alert("菜品名称不能为空");return;}
  dishData.push({name,price,img:singleDishBase64,note});
  localStorage.setItem("dishStore",JSON.stringify(dishData));
  closeAdd();
  renderDish();
  document.getElementById("dname").value="";
  document.getElementById("dprice").value="";
  document.getElementById("dnote").value="";
}
function delDish(i){
  dishData.splice(i,1);
  localStorage.setItem("dishStore",JSON.stringify(dishData));
  renderDish();
}

// 批量表格模块
function showBatchAdd(){
    document.getElementById("batchForm").classList.remove("hidden");
    document.querySelector("#batchTable tbody").innerHTML = "";
    addTableRow();
}
function closeBatchAdd(){document.getElementById("batchForm").classList.add("hidden")}

function addTableRow(){
    const tbody = document.querySelector("#batchTable tbody");
    const tr = document.createElement("tr");
    tr.innerHTML = `
    <td><input placeholder="菜品名称" class="t-name"></td>
    <td><input placeholder="价格" class="t-price"></td>
    <td>
        <input type="file" accept="image/*" class="t-file">
        <img class="table-img-preview t-prev" style="display:none;">
    </td>
    <td><input placeholder="备注" class="t-note"></td>
    <td><button class="btn btn-gray" onclick="this.closest('tr').remove()">删除</button></td>
    `;
    tbody.appendChild(tr);
    // 当前行图片上传监听
    const fileInput = tr.querySelector(".t-file");
    const previewImg = tr.querySelector(".t-prev");
    fileInput.addEventListener("change",function(e){
        const f = e.target.files[0];
        if(!f) return;
        const rd = new FileReader();
        rd.onload = function(res){
            previewImg.src = res.target.result;
            previewImg.style.display = "block";
            tr.dataset.base64 = res.target.result;
        }
        rd.readAsDataURL(f);
    })
}

function batchSave(){
    const rows = document.querySelectorAll("#batchTable tbody tr");
    let addCount = 0;
    rows.forEach(tr=>{
        const name = tr.querySelector(".t-name").value.trim();
        const price = tr.querySelector(".t-price").value.trim();
        const note = tr.querySelector(".t-note").value.trim();
        const imgBase64 = tr.dataset.base64 || "";
        if(!name) return;
        dishData.push({
            name,price,img:imgBase64,note
        })
        addCount +=1;
    })
    localStorage.setItem("dishStore",JSON.stringify(dishData));
    closeBatchAdd();
    renderDish();
    alert(`成功导入 ${addCount} 条菜品`);
}

// 访客点菜页面
function renderVisitDish(){
  let html = "";
  dishData.forEach((item,idx)=>{
    let imgHtml = item.img ? `<img class="dish-img-small" src="${item.img}">` : `<div class="dish-img-small"></div>`;
    html += `<div class="dish-item">
    ${imgHtml}
    <div>${item.name}｜¥${item.price}<br><small style="color:#999;">${item.note||""}</small></div>
    <button class="btn btn-primary" onclick="addCart(${idx})">加入订单</button>
    </div>`
  })
  document.getElementById("visitDishList").innerHTML = html||"<p>商家还没有添加菜品哦</p>";
  renderCart();
}
function addCart(idx){
  cart.push(dishData[idx]);
  renderCart();
}
function renderCart(){
  let html = "";
  cart.forEach((it,i)=>{
    html += `<div class="dish-item">${it.name} ¥${it.price}<button class="btn btn-gray" onclick="cart.splice(${i});renderCart()">移除</button></div>`
  })
  document.getElementById("cartBox").innerHTML = html||"<p>暂时没有选中菜品</p>";
}

// 分享二维码链接
function genShare(){
  let domain = window.location.origin;
  let shareUrl = domain + "/#/order";
  document.getElementById("shareLink").innerText = shareUrl;
  QRCode.toCanvas(document.getElementById("qrcanvas"),shareUrl,{width:260});
}
function copyLink(){
  let txt = document.getElementById("shareLink").innerText;
  navigator.clipboard.writeText(txt).then(()=>alert("分享链接复制完成"));
}

// 下单发送邮件
function submitOrder(){
  if(cart.length===0){alert("至少选择一道菜品");return;}
  let orderText = cart.map(x=>`${x.name} ￥${x.price} 备注：${x.note||"无"}`).join("\n");
  let sendData = {
    order_content: orderText,
    site_domain: window.location.origin
  }
  emailjs.send(EMAIL_SERVICE_ID,EMAIL_TEMPLATE_ID,sendData)
  .then(res=>{
    alert("下单成功！订单邮件已发送");
    cart = [];renderCart();
  },err=>{
    alert("邮件发送失败，请核对EmailJS密钥");
    console.log(err);
  })
}

window.onhashchange = route;
route();
</script>
</body>
</html>
