<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情侣私房点餐平台</title>
    <!-- 样式和发邮件工具库 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap');
        body { font-family: 'Quicksand', 'Noto Sans SC', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .exam-card { border-radius: 1rem; box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08); background: #ffffff; border: 1px solid #e2e8f0; }
        .primary-btn { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: white; border-radius: 9999px; font-weight: 700; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); }
        .primary-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.4); }
        .green-btn { background: linear-gradient(135deg, #10b981, #059669); color: white; border-radius: 9999px; font-weight:700; }
        .red-btn { background:#ef4444; color:white; border-radius:9999px; }
    </style>
</head>
<body class="min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-slate-900 text-white sticky top-0 z-50 px-6 py-3 flex justify-between items-center shadow-md">
        <div class="flex items-center space-x-3">
            <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow">
                <i class="fa-solid fa-utensils text-base"></i>
            </div>
            <div>
                <h1 class="font-bold text-sm tracking-wide">情侣私房点餐管理平台</h1>
                <p class="text-[10px] text-slate-400">奶奶的专属小厨房 · 下单自动邮箱通知</p>
            </div>
        </div>
        <div id="nav-user-info" class="hidden flex items-center space-x-4">
            <span id="display-current-user" class="text-xs text-slate-300 font-medium">店主</span>
            <button onclick="logout()" class="text-xs text-slate-400 hover:text-white font-medium transition"><i class="fa-solid fa-power-off mr-1"></i>退出登录</button>
        </div>
    </header>

    <main class="flex-1 max-w-6xl w-full mx-auto p-4 md:p-6 flex flex-col">
        <!-- 登录模块 -->
        <section id="auth-section" class="max-w-md mx-auto w-full exam-card p-8 space-y-6">
            <div class="text-center">
                <h2 class="text-xl font-bold text-slate-800">店主登录</h2>
                <p class="text-xs text-slate-500 mt-1">输入您的名字和接收邮件的QQ邮箱</p>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">您的昵称</label>
                <input type="text" id="shop-owner-name" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 text-xs bg-slate-50" placeholder="例如：奶奶">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">接收订单的邮箱（QQ或163）</label>
                <input type="email" id="owner-email" class="w-full px-3 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:border-blue-500 text-xs bg-slate-50" placeholder="你的QQ号@qq.com">
            </div>
            <button onclick="loginShop()" class="w-full py-3 primary-btn text-xs">进入点餐管理系统</button>
        </section>

        <!-- 后台主面板 -->
        <section id="shop-dashboard" class="hidden space-y-6">
            <div class="grid grid-cols-2 md:grid-cols-4 gap-2 bg-white p-2 rounded-xl shadow-sm border border-slate-200">
                <button onclick="switchModule('restaurant')" id="mod-rest" class="py-2.5 px-3 rounded-lg text-xs font-bold bg-blue-600 text-white transition">餐厅管理</button>
                <button onclick="switchModule('dish')" id="mod-dish" class="py-2.5 px-3 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 transition">菜品编辑</button>
                <button onclick="switchModule('cart')" id="mod-cart" class="py-2.5 px-3 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 transition">点餐台</button>
                <button onclick="switchModule('order')" id="mod-order" class="py-2.5 px-3 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 transition">订单记录</button>
            </div>

            <!-- 1. 餐厅管理 -->
            <div id="panel-restaurant" class="exam-card p-6 space-y-5">
                <h3 class="text-base font-bold text-slate-800">🏠 创建专属餐厅</h3>
                <div class="flex gap-2">
                    <input id="rest-name" class="flex-1 px-3 py-2 rounded border text-xs bg-slate-50" placeholder="例如：长寿爱心小炒">
                    <button onclick="createRestaurant()" class="px-4 py-2 primary-btn text-xs">新建餐厅</button>
                </div>
                <div id="rest-list" class="space-y-3 mt-4 text-xs text-slate-500">暂无餐厅</div>
            </div>

            <!-- 2. 菜品编辑 -->
            <div id="panel-dish" class="exam-card p-6 space-y-5 hidden">
                <h3 class="text-base font-bold text-slate-800">🍱 菜单管理</h3>
                <div class="space-y-4 pt-2">
                    <div>
                        <label class="text-xs font-bold">选择餐厅</label>
                        <select id="dish-rest-select" class="w-full px-3 py-2 rounded border text-xs bg-slate-50 mt-1"></select>
                    </div>
                    <div class="grid md:grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold">菜名</label>
                            <input id="dish-name" class="w-full px-3 py-2 rounded border text-xs bg-slate-50 mt-1" placeholder="红烧肉">
                        </div>
                        <div>
                            <label class="text-xs font-bold">价格（元）</label>
                            <input id="dish-price" type="number" class="w-full px-3 py-2 rounded border text-xs bg-slate-50 mt-1" placeholder="38">
                        </div>
                    </div>
                    <div>
                        <label class="text-xs font-bold">菜品介绍</label>
                        <input id="dish-desc" class="w-full px-3 py-2 rounded border text-xs bg-slate-50 mt-1" placeholder="肥而不腻，软烂香甜">
                    </div>
                    <button onclick="addSingleDish()" class="px-4 py-2 primary-btn text-xs">添加这道菜</button>
                </div>
                <div class="mt-4 border-t pt-4">
                    <h4 class="text-xs font-bold text-slate-700">已添加的菜品：</h4>
                    <div id="dish-list" class="mt-2 text-xs text-slate-500">暂无菜品</div>
                </div>
            </div>

            <!-- 3. 点餐台 -->
            <div id="panel-cart" class="exam-card p-6 space-y-5 hidden">
                <h3 class="text-base font-bold text-slate-800">🛒 点餐下单页面</h3>
                <div>
                    <label class="text-xs font-bold">选择点餐餐厅</label>
                    <select id="cart-rest-select" onchange="renderCartDish()" class="w-full px-3 py-2 rounded border text-xs bg-slate-50 mt-1"></select>
                </div>
                <div id="cart-dish-box" class="grid md:grid-cols-3 gap-3 mt-3"></div>
                <div class="border-t pt-4 mt-4">
                    <h4 class="font-bold text-xs">购物车清单</h4>
                    <div id="cart-list" class="text-xs mt-2 text-slate-500">购物车是空的</div>
                    <div class="flex justify-between items-center mt-4 bg-slate-50 p-3 rounded-lg">
                        <span class="font-bold text-sm">总计：¥<span id="total-price">0</span></span>
                        <button onclick="submitOrder()" class="px-5 py-2 green-btn text-xs">提交订单并自动发邮件通知</button>
                    </div>
                </div>
            </div>

            <!-- 4. 历史订单 -->
            <div id="panel-order" class="exam-card p-6 space-y-5 hidden">
                <h3 class="text-base font-bold text-slate-800">📋 历史订单记录</h3>
                <div id="order-list" class="text-xs space-y-3 text-slate-500">暂无订单</div>
            </div>
        </section>
    </main>

    <script>
        // ====================== 填写您的邮件密钥 ======================
        const EMAILJS_USER_ID = "替换成你的userID";
        const EMAILJS_SERVICE_ID = "替换成你的serviceID";
        const EMAILJS_TEMPLATE_ID = "替换成你的templateID";

        let shopUser = { name: "", email: "" };
        let restList = JSON.parse(localStorage.getItem("restData")) || [];
        let dishList = JSON.parse(localStorage.getItem("dishData")) || [];
        let orderList = JSON.parse(localStorage.getItem("orderData")) || [];
        let cartData = [];

        window.onload = function(){
            try { emailjs.init(EMAILJS_USER_ID); } catch(e){}
            refreshAllSelect();
            renderRestList();
            renderDishList();
        }

        function loginShop(){
            let name = document.getElementById("shop-owner-name").value.trim();
            let mail = document.getElementById("owner-email").value.trim();
            if(!name || !mail){
                alert("请先填好您的名字和接收邮件的QQ邮箱哦！");
                return;
            }
            shopUser = {name, email: mail};
            document.getElementById("auth-section").classList.add("hidden");
            document.getElementById("shop-dashboard").classList.remove("hidden");
            document.getElementById("nav-user-info").classList.remove("hidden");
            document.getElementById("display-current-user").innerText = "店主：" + name;
            alert("登录成功！");
        }

        function logout(){ location.reload(); }

        function switchModule(mod){
            ["restaurant","dish","cart","order"].forEach(m=>{
                document.getElementById("panel-"+m).classList.add("hidden");
                document.getElementById("mod-"+m).className = "py-2.5 px-3 rounded-lg text-xs font-bold text-slate-700 hover:bg-slate-100 transition";
            })
            document.getElementById("panel-"+mod).classList.remove("hidden");
            document.getElementById("mod-"+mod).className = "py-2.5 px-3 rounded-lg text-xs font-bold bg-blue-600 text-white transition";
            if(mod=="cart") renderCartDish();
            if(mod=="order") renderOrderList();
        }

        function createRestaurant(){
            let rName = document.getElementById("rest-name").value.trim();
            if(!rName){ alert("请输入餐厅名字！"); return; }
            restList.push({ id: Date.now(), name: rName });
            localStorage.setItem("restData", JSON.stringify(restList));
            document.getElementById("rest-name").value = "";
            renderRestList();
            refreshAllSelect();
            alert("餐厅创建成功！");
        }

        function renderRestList(){
            let box = document.getElementById("rest-list");
            if(restList.length==0){ box.innerHTML = "暂无餐厅"; return; }
            let html = "";
            restList.forEach(r=>{
                html += `<div class="bg-slate-50 p-3 rounded border flex justify-between items-center">
                    <span class="font-bold">${r.name}</span>
                    <button onclick="delRest(${r.id})" class="text-xs text-red-500 font-bold">删除</button>
                </div>`;
            });
            box.innerHTML = html;
        }

        function delRest(id){
            restList = restList.filter(item=>item.id != id);
            localStorage.setItem("restData", JSON.stringify(restList));
            renderRestList();
            refreshAllSelect();
        }

        function refreshAllSelect(){
            let optHtml = "<option value=''>--请选择餐厅--</option>";
            restList.forEach(r=>optHtml += `<option value="${r.id}">${r.name}</option>`);
            document.getElementById("dish-rest-select").innerHTML = optHtml;
            document.getElementById("cart-rest-select").innerHTML = optHtml;
        }

        function addSingleDish(){
            let rid = document.getElementById("dish-rest-select").value;
            let dName = document.getElementById("dish-name").value.trim();
            let dPrice = Number(document.getElementById("dish-price").value);
            let dDesc = document.getElementById("dish-desc").value.trim();
            if(!rid || !dName || !dPrice){ alert("请完整选择餐厅、填写菜名和价格！"); return; }
            dishList.push({ id: Date.now(), restId: rid, name: dName, price: dPrice, desc: dDesc });
            localStorage.setItem("dishData", JSON.stringify(dishList));
            document.getElementById("dish-name").value = "";
            document.getElementById("dish-price").value = "";
            document.getElementById("dish-desc").value = "";
            renderDishList();
            alert("菜品添加成功！");
        }

        function renderDishList(){
            let box = document.getElementById("dish-list");
            if(dishList.length==0){ box.innerHTML = "暂无菜品"; return; }
            let html = "";
            dishList.forEach(d=>{
                let rObj = restList.find(r=>r.id==d.restId);
                let rName = rObj ? rObj.name : "未知餐厅";
                html += `<div class="bg-slate-50 p-2 rounded flex justify-between items-center my-1 border">
                    <span>${d.name} （¥${d.price}） - [${rName}]</span>
                    <button onclick="delDish(${d.id})" class="text-red-500 text-xs">删除</button>
                </div>`;
            });
            box.innerHTML = html;
        }

        function delDish(id){
            dishList = dishList.filter(d=>d.id!=id);
            localStorage.setItem("dishData", JSON.stringify(dishList));
            renderDishList();
        }

        function renderCartDish(){
            let rid = document.getElementById("cart-rest-select").value;
            let box = document.getElementById("cart-dish-box");
            cartData = [];
            refreshCart();
            if(!rid){ box.innerHTML = "请先选择一家餐厅"; return; }
            let curDishes = dishList.filter(d=>d.restId==rid);
            if(curDishes.length==0){ box.innerHTML = "该餐厅还没有菜，快去“菜品编辑”添加吧！"; return; }
            let html = "";
            curDishes.forEach(d=>{
                html += `<div class="exam-card p-3 space-y-1">
                    <p class="font-bold text-sm">${d.name}</p>
                    <p class="text-[11px] text-slate-500">${d.desc || '暂无介绍'}</p>
                    <p class="text-blue-600 font-bold text-xs">¥${d.price}</p>
                    <button onclick='addCart(${JSON.stringify(d})' class="mt-2 w-full py-1 primary-btn text-xs">加入购物车</button>
                </div>`;
            });
            box.innerHTML = html;
        }

        function addCart(dish){
            cartData.push(dish);
            refreshCart();
        }

        function refreshCart(){
            let cartBox = document.getElementById("cart-list");
            let total = 0;
            let html = "";
            cartData.forEach((item,idx)=>{
                total += item.price;
                html += `<div class="flex justify-between py-1 border-b">
                    <span>${item.name} <strong>¥${item.price}</strong></span>
                    <button onclick="removeCart(${idx})" class="text-red-500 text-xs">移除</button>
                </div>`;
            });
            cartBox.innerHTML = html || "购物车是空的";
            document.getElementById("total-price").innerText = total;
        }

        function removeCart(idx){
            cartData.splice(idx,1);
            refreshCart();
        }

        function submitOrder(){
            if(cartData.length==0){ alert("购物车空空如也，不能下单哦！"); return; }
            let rid = document.getElementById("cart-rest-select").value;
            let rObj = restList.find(r=>r.id==rid);
            let restName = rObj ? rObj.name : "私房餐厅";
            let total = cartData.reduce((sum,item)=>sum+item.price, 0);

            let orderText = "";
            cartData.forEach(d=> orderText += `- ${d.name} （¥${d.price}）\n`);

            let newOrder = {
                id: Date.now(),
                time: new Date().toLocaleString(),
                restName: restName,
                goods: [...cartData],
                total: total
            };
            orderList.unshift(newOrder);
            localStorage.setItem("orderData", JSON.stringify(orderList));

            // 发送邮件参数
            let sendData = {
                to_email: shopUser.email,
                shop_name: restName,
                order_content: orderText,
                order_time: newOrder.time,
                total_money: "¥" + total
            };

            emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, sendData)
            .then(()=>{
                alert("下单成功！订单消息已经自动发到您的邮箱啦！");
                cartData = [];
                refreshCart();
                switchModule("order");
            })
            .catch(err=>{
                alert("订单虽然在本地保存成功了，但邮件没发出去。请检查代码最上方的3个ID有没有填对！");
                console.log(err);
            });
        }

        function renderOrderList(){
            let box = document.getElementById("order-list");
            if(orderList.length==0){ box.innerHTML = "暂无历史订单"; return; }
            let html = "";
            orderList.forEach(o=>{
                let gStr = "";
                o.goods.forEach(g=> gStr += `${g.name}(¥${g.price}) `);
                html += `<div class="bg-slate-50 p-3 rounded border space-y-1">
                    <p class="font-bold text-slate-800">${o.restName} — 下单时间：${o.time}</p>
                    <p class="text-slate-600">菜品：${gStr}</p>
                    <p class="text-emerald-600 font-bold">总计：¥${o.total}</p>
                </div>`;
            });
            box.innerHTML = html;
        }
    </script>
</body>
</html>
